services:
  app:
    image: agendify-app-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendify-app
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agendify
      DB_USERNAME: agendify
      DB_PASSWORD: agendify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: agendify-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    image: agendify-app-local
    container_name: agendify-queue
    command: php artisan queue:work --tries=3 --queue=default,notifications
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      - app
      - redis
      - postgres

  scheduler:
    image: agendify-app-local
    container_name: agendify-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
      - /var/www/vendor
    depends_on:
      - app
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: agendify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agendify
      POSTGRES_USER: agendify
      POSTGRES_PASSWORD: agendify
    volumes:
      - agendify_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agendify-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: agendify-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  agendify_postgres_data:
