x-laravel-env: &laravel-env
  APP_ENV: local
  APP_DEBUG: true
  APP_URL: http://localhost:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: agendify
  DB_USERNAME: agendify
  DB_PASSWORD: agendify
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PASSWORD: null
  REDIS_PORT: 6379
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_USERNAME: null
  MAIL_PASSWORD: null
  MAIL_FROM_ADDRESS: noreply@agendify.local
  MAIL_FROM_NAME: Agendify

services:
  app:
    image: agendify-app-local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendify-app
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment: *laravel-env
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: agendify-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    image: agendify-app-local
    container_name: agendify-queue
    command: php artisan queue:work --tries=3 --queue=default,notifications
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment: *laravel-env
    depends_on:
      - app
      - redis
      - postgres

  scheduler:
    image: agendify-app-local
    container_name: agendify-scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment: *laravel-env
    depends_on:
      - app
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: agendify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agendify
      POSTGRES_USER: agendify
      POSTGRES_PASSWORD: agendify
    volumes:
      - agendify_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agendify-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: agendify-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  agendify_postgres_data:
