[www]
pm = dynamic

; Otimização para ambiente local: permite mais requests paralelos (ex: multiplos assets/xhr na mesma tela)
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; Timeout seguro para processos pendurados
request_terminate_timeout = 60s
; Mata processos ociosos depois de 10s para liberar memória no ambiente local
pm.process_idle_timeout = 10s
